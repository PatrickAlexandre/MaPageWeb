<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patou — Découvrir</title><style>:root{--fond:#fff;--doux:#f5f5f5;--bord:#e5e5e5;--texte:#0f0f0f;--gris:#606060;--nav:240px}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--texte);background:var(--fond)}button,input{font:inherit}button{cursor:pointer}.navigation{position:fixed;inset:0 auto 0 0;width:var(--nav);padding:18px 14px;border-right:1px solid var(--bord);background:#fff;z-index:20}.marque{font-size:22px;font-weight:800;padding:8px 12px 24px}.lien{width:100%;border:0;background:transparent;padding:12px 14px;margin:2px 0;border-radius:11px;text-align:left;font-size:15px;display:flex;gap:16px;align-items:center}.lien:hover,.lien.actif{background:var(--doux);font-weight:700}.icone{font-size:21px;width:25px;text-align:center}.separateur{height:1px;background:var(--bord);margin:14px 8px}.page{margin-left:var(--nav)}.haut{height:68px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--bord);display:flex;align-items:center;padding:0 28px;z-index:10}.recherche{width:min(600px,70vw);border:1px solid #ccc;border-radius:24px;padding:11px 18px;outline:0}.contenu{max-width:1180px;margin:auto;padding:26px}.titre{font-size:27px;margin:0 0 20px}.onglets{display:flex;gap:9px;overflow:auto;margin-bottom:22px}.onglet{border:0;border-radius:9px;padding:9px 14px;white-space:nowrap;background:var(--doux)}.onglet.actif{background:#111;color:#fff}.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 16px}.carte{cursor:pointer}.media{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#161616,#666);display:grid;place-items:center;color:#fff;font-size:54px}.infos{display:flex;gap:10px;padding-top:11px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--doux);display:grid;place-items:center;flex:none}.nom{font-weight:700;font-size:15px;line-height:1.3}.meta{font-size:13px;color:var(--gris);margin-top:5px}.panneau{max-width:760px}.bloc{border:1px solid var(--bord);border-radius:16px;padding:20px;margin-bottom:15px}.ligne{display:flex;align-items:center;gap:14px}.gros-avatar{width:74px;height:74px;border-radius:50%;background:var(--doux);display:grid;place-items:center;font-size:35px}.bouton{border:0;background:#111;color:#fff;border-radius:22px;padding:10px 18px;font-weight:700}.vide{padding:70px 20px;text-align:center;color:var(--gris)}.navigation-mobile{display:none}@media(max-width:900px){:root{--nav:76px}.texte,.marque span{display:none}.lien{justify-content:center}.grille{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding-bottom:64px}.navigation{display:none}.page{margin-left:0}.haut{height:58px;padding:0 12px}.recherche{width:100%}.contenu{padding:15px 12px}.grille{grid-template-columns:1fr}.navigation-mobile{display:grid;position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--bord);grid-template-columns:repeat(5,1fr);z-index:30}.navigation-mobile button{border:0;background:#fff;font-size:21px}.titre{font-size:23px}}</style></head><body><aside class="navigation"><div class="marque">P <span>Patou</span></div><nav id="menu"><button class="lien actif" data-page="accueil"><b class="icone">⌂</b><span class="texte">Accueil</span></button><button class="lien" data-page="rechercher"><b class="icone">⌕</b><span class="texte">Rechercher</span></button><button class="lien" data-page="decouvrir"><b class="icone">◈</b><span class="texte">Découvrir</span></button><button class="lien" data-page="videos"><b class="icone">▶</b><span class="texte">Vidéos</span></button><div class="separateur"></div><button class="lien" data-page="messages"><b class="icone">✉</b><span class="texte">Messages</span></button><button class="lien" data-page="notifications"><b class="icone">♡</b><span class="texte">Notifications</span></button><button class="lien" data-page="enregistres"><b class="icone">▱</b><span class="texte">Enregistrés</span></button><button class="lien" data-page="profil"><b class="icone">○</b><span class="texte">Profil</span></button></nav></aside><main class="page"><header class="haut"><input id="recherche" class="recherche" placeholder="Rechercher"></header><div id="contenu" class="contenu"></div></main><nav class="navigation-mobile"><button data-page="accueil">⌂</button><button data-page="rechercher">⌕</button><button data-page="videos">▶</button><button data-page="notifications">♡</button><button data-page="profil">○</button></nav><script>const publications=[['🌌','Pourquoi les étoiles ont-elles des couleurs différentes ?','Sciences','42 k vues'],['🧠','Comment une intelligence artificielle apprend-elle ?','Technologie','31 k vues'],['🏛️','À quoi ressemblait la vie quotidienne à Rome ?','Histoire','54 k vues'],['🌳','Comment les arbres communiquent-ils ?','Nature','18 k vues'],['🎨','Pourquoi certaines œuvres deviennent-elles célèbres ?','Culture','12 k vues'],['🎮','Comment construit-on un bon jeu vidéo ?','Jeux vidéo','27 k vues']];const contenu=document.querySelector('#contenu'),champ=document.querySelector('#recherche');function cartes(liste=publications){return `<div class="grille">${liste.map(p=>`<article class="carte"><div class="media">${p[0]}</div><div class="infos"><div class="avatar">P</div><div><div class="nom">${p[1]}</div><div class="meta">Patrick Alexandre · ${p[2]} · ${p[3]}</div></div></div></article>`).join('')}</div>`}const pages={accueil:()=>`<h1 class="titre">Accueil</h1><div class="onglets"><button class="onglet actif">Tout</button><button class="onglet">Sciences</button><button class="onglet">Technologie</button><button class="onglet">Histoire</button><button class="onglet">Nature</button><button class="onglet">Culture</button></div>${cartes()}`,rechercher:()=>`<h1 class="titre">Rechercher</h1><div class="vide">Utilise la barre de recherche pour trouver un sujet, une vidéo ou un article.</div>`,decouvrir:()=>`<h1 class="titre">Découvrir</h1><div class="onglets"><button class="onglet actif">Tendances</button><button class="onglet">Nouveau</button><button class="onglet">Populaire</button></div>${cartes([...publications].reverse())}`,videos:()=>`<h1 class="titre">Vidéos</h1>${cartes(publications.slice(0,4))}`,messages:()=>`<div class="panneau"><h1 class="titre">Messages</h1><div class="bloc ligne"><div class="avatar">M</div><div><b>Marie</b><div class="meta">Super intéressant ton dernier sujet !</div></div></div><div class="bloc ligne"><div class="avatar">L</div><div><b>Lucas</b><div class="meta">Tu peux faire un article sur l'espace ?</div></div></div></div>`,notifications:()=>`<div class="panneau"><h1 class="titre">Notifications</h1><div class="bloc">♡ Marie a aimé votre publication sur les étoiles.</div><div class="bloc">💬 Lucas a commenté votre publication.</div><div class="bloc">＋ Sophie vous suit maintenant.</div></div>`,enregistres:()=>`<h1 class="titre">Enregistrés</h1>${cartes(publications.slice(0,3))}`,profil:()=>`<div class="panneau"><div class="ligne"><div class="gros-avatar">P</div><div><h1 class="titre" style="margin:0">Patrick Alexandre</h1><div class="meta">Créateur · Famille & amis</div></div><button class="bouton" style="margin-left:auto">Modifier</button></div><div class="separateur"></div><h2>Mes publications</h2>${cartes(publications.slice(0,3))}</div>`};function ouvrir(page,ajouter=true){page=pages[page]?page:'accueil';contenu.innerHTML=pages[page]();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('actif',b.dataset.page===page));if(ajouter)history.pushState({page},'',`#${page}`);window.scrollTo(0,0)}document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)ouvrir(b.dataset.page)});champ.addEventListener('focus',()=>ouvrir('rechercher'));champ.addEventListener('input',()=>{const q=champ.value.toLowerCase().trim();contenu.innerHTML=`<h1 class="titre">Résultats</h1>${cartes(publications.filter(p=>p.join(' ').toLowerCase().includes(q)))}`});window.addEventListener('popstate',e=>ouvrir(e.state?.page||location.hash.slice(1)||'accueil',false));ouvrir(location.hash.slice(1)||'accueil',false);</script></body></html>
