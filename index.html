<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrick</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--fond:#fff;--doux:#f2f2f2;--bord:#e5e5e5;--texte:#0f0f0f;--gris:#606060;--nav:240px}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--texte)}button,input{font:inherit}.navigation{position:fixed;inset:0 auto 0 0;width:var(--nav);height:100vh;padding:16px 12px;border-right:1px solid var(--bord);background:#fff;overflow-y:auto}.marque{font:800 22px 'Manrope';padding:8px 12px 22px;display:flex;align-items:center;gap:11px}.logo{width:34px;height:34px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center}.lien{width:100%;height:48px;border:0;background:transparent;padding:0 12px;margin:2px 0;border-radius:10px;text-align:left;font-size:15px;display:flex;gap:18px;align-items:center;cursor:pointer}.lien:hover,.lien.actif{background:var(--doux)}.lien.actif{font-weight:700}.icone{font-size:21px;width:26px;text-align:center}.separateur{height:1px;background:var(--bord);margin:14px 8px}.page{margin-left:var(--nav)}.haut{height:68px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--bord);display:flex;align-items:center;padding:0 28px}.recherche{width:min(600px,70vw);border:1px solid #ccc;border-radius:24px;padding:11px 18px}.contenu{max-width:1180px;margin:auto;padding:26px}.titre{font:800 27px 'Manrope';margin:0 0 20px}.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 16px}.media{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#161616,#666);display:grid;place-items:center;color:#fff;font-size:54px}.infos{display:flex;gap:10px;padding-top:11px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--doux);display:grid;place-items:center;font-weight:700}.nom{font-weight:700}.meta{font-size:13px;color:var(--gris);margin-top:5px}.bloc{border:1px solid var(--bord);border-radius:16px;padding:20px;margin-bottom:15px}.vide{padding:60px 20px;text-align:center;color:var(--gris)}@media(max-width:900px){:root{--nav:76px}.texte,.nom-marque{display:none}.lien{justify-content:center;padding:0}.grille{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.navigation{display:none}.page{margin-left:0}.contenu{padding:15px 12px}.grille{grid-template-columns:1fr}.recherche{width:100%}}</style></head><body><aside class="navigation"><div class="marque"><div class="logo">P</div><span class="nom-marque">Patrick</span></div><nav><button class="lien actif" data-page="accueil"><span class="icone">⌂</span><span class="texte">Accueil</span></button><button class="lien" data-page="rechercher"><span class="icone">⌕</span><span class="texte">Rechercher</span></button><button class="lien" data-page="decouvrir"><span class="icone">◈</span><span class="texte">Découvrir</span></button><button class="lien" data-page="videos"><span class="icone">▶</span><span class="texte">Vidéos</span></button><div class="separateur"></div><button class="lien" data-page="restaurant"><span class="icone">🍽</span><span class="texte">Restaurant</span></button><button class="lien" data-page="banque"><span class="icone">🏦</span><span class="texte">Banque</span></button><button class="lien" data-page="sante"><span class="icone">♡</span><span class="texte">Santé</span></button><button class="lien" data-page="identite"><span class="icone">🪪</span><span class="texte">Identité</span></button><div class="separateur"></div><button class="lien" data-page="messages"><span class="icone">✉</span><span class="texte">Messages</span></button><button class="lien" data-page="notifications"><span class="icone">♢</span><span class="texte">Notifications</span></button><button class="lien" data-page="enregistres"><span class="icone">▱</span><span class="texte">Enregistrés</span></button><button class="lien" data-page="profil"><span class="icone">○</span><span class="texte">Profil</span></button><button class="lien" data-page="parametres"><span class="icone">⚙</span><span class="texte">Paramètres</span></button></nav></aside><main class="page"><header class="haut"><input id="recherche" class="recherche" placeholder="Rechercher dans Patrick"></header><div id="contenu" class="contenu"></div></main><script>const publications=[['🌌','Pourquoi les étoiles ont-elles des couleurs différentes ?','Sciences'],['🧠','Comment une intelligence artificielle apprend-elle ?','Technologie'],['🏛️','La vie quotidienne à Rome','Histoire'],['🌳','Comment les arbres communiquent-ils ?','Nature'],['🎨','Pourquoi certaines œuvres deviennent célèbres ?','Culture'],['🎮','Comment construit-on un bon jeu vidéo ?','Jeux vidéo']];const contenu=document.querySelector('#contenu'),champ=document.querySelector('#recherche');function cartes(liste=publications){return `<div class="grille">${liste.map(p=>`<article><div class="media">${p[0]}</div><div class="infos"><div class="avatar">P</div><div><div class="nom">${p[1]}</div><div class="meta">Patrick Alexandre · ${p[2]}</div></div></div></article>`).join('')}</div>`}function pageSimple(titre,texte,icone){return `<h1 class="titre">${titre}</h1><div class="bloc"><div style="font-size:42px;margin-bottom:12px">${icone}</div>${texte}</div>`}const pages={accueil:()=>`<h1 class="titre">Accueil</h1>${cartes()}`,rechercher:()=>`<h1 class="titre">Rechercher</h1><div class="vide">Recherche un contenu dans Patrick.</div>`,decouvrir:()=>`<h1 class="titre">Découvrir</h1>${cartes([...publications].reverse())}`,videos:()=>`<h1 class="titre">Vidéos</h1>${cartes(publications.slice(0,4))}`,restaurant:()=>pageSimple('Restaurant','Tes restaurants, découvertes culinaires et adresses pourront être regroupés ici.','🍽️'),banque:()=>pageSimple('Banque','Ton espace banque et finances personnelles.','🏦'),sante:()=>pageSimple('Santé','Ton espace dédié à la santé et au bien-être.','♡'),identite:()=>pageSimple('Identité','Ton espace personnel et tes informations d’identité.','🪪'),messages:()=>pageSimple('Messages','Tes conversations apparaîtront ici.','✉️'),notifications:()=>pageSimple('Notifications','Tes nouvelles notifications apparaîtront ici.','🔔'),enregistres:()=>`<h1 class="titre">Enregistrés</h1>${cartes(publications.slice(0,3))}`,profil:()=>pageSimple('Patrick Alexandre','Créateur · Famille & amis','P'),parametres:()=>pageSimple('Paramètres','Personnalisation, préférences et réglages de Patrick.','⚙️')};function ouvrir(page,ajouter=true){page=pages[page]?page:'accueil';contenu.innerHTML=pages[page]();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('actif',b.dataset.page===page));if(ajouter)history.pushState({page},'',`#${page}`);window.scrollTo(0,0)}document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)ouvrir(b.dataset.page)});champ.addEventListener('input',()=>{const q=champ.value.toLowerCase().trim();contenu.innerHTML=`<h1 class="titre">Résultats</h1>${cartes(publications.filter(p=>p.join(' ').toLowerCase().includes(q)))}`});window.addEventListener('popstate',e=>ouvrir(e.state?.page||location.hash.slice(1)||'accueil',false));ouvrir(location.hash.slice(1)||'accueil',false);</script></body></html>
